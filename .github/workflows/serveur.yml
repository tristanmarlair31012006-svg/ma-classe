# Met en ligne le serveur de discussion sur Cloudflare.
# Se lance tout seul quand le dossier serveur/ change, ou à la main (onglet Actions → « Run workflow »).
# Les clés ne sont jamais dans le code : elles viennent des Secrets du dépôt (Settings → Secrets and variables → Actions).
name: Serveur de la classe

on:
  push:
    branches: [main]
    paths: ["serveur/**", ".github/workflows/serveur.yml"]
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets Cloudflare présents ?
        id: verif
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$C" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Secrets Cloudflare pas encore créés : rien à déployer."; fi
      - uses: actions/checkout@v4
        if: steps.verif.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.verif.outputs.ok == '1'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.verif.outputs.ok == '1'
        working-directory: serveur
      - uses: cloudflare/wrangler-action@v3
        if: steps.verif.outputs.ok == '1'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: serveur
          command: deploy
      # Les secrets vides sont ignorés : le suivi des élèves marche sans Azure (seule la traduction en a besoin).
      - name: Secrets du serveur
        if: steps.verif.outputs.ok == '1'
        working-directory: serveur
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AZURE_CLE: ${{ secrets.AZURE_CLE }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          CODE_CLASSE: ${{ secrets.CODE_CLASSE }}
          CLE_PROF: ${{ secrets.CLE_PROF }}
        run: |
          for NOM in CODE_CLASSE CLE_PROF AZURE_CLE AZURE_REGION; do
            VALEUR="${!NOM}"
            if [ -n "$VALEUR" ]; then printf '%s' "$VALEUR" | npx wrangler secret put "$NOM"; else echo "$NOM vide : ignoré"; fi
          done
