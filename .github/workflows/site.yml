# Met l'app en ligne sur Cloudflare Pages : https://ma-classe-arh-daspa.pages.dev
# Se lance tout seul à chaque changement de l'app, ou à la main (onglet Actions → « Run workflow »).
# Utilise les mêmes secrets que le serveur : CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID.
# Seuls les fichiers de l'app sont publiés (pas le dossier serveur/ ni les guides).
name: Site de la classe

# main = la vraie appli (élèves). Une autre branche = version d'essai à part :
# https://<nom-de-la-branche>.ma-classe-arh-daspa.pages.dev (sans toucher aux iPads des élèves).
on:
  push:
    paths-ignore: ["serveur/**", "**.md", ".github/workflows/serveur.yml"]
  workflow_dispatch:

env:
  PROJET: ma-classe-arh-daspa

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets Cloudflare présents ?
        id: verif
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$C" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Secrets Cloudflare pas encore créés : rien à publier."; fi
      - uses: actions/checkout@v4
        if: steps.verif.outputs.ok == '1'
      - name: Préparer les fichiers de l'app
        if: steps.verif.outputs.ok == '1'
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest jour.json _site/
          cp -r css js fonts icones img _site/
          cp -r commun accueil lecons suivi daspa _site/
          [ -d pictos ] && cp -r pictos _site/ || true
      - uses: actions/setup-node@v4
        if: steps.verif.outputs.ok == '1'
        with:
          node-version: 22
      - name: Créer le projet (la première fois seulement)
        if: steps.verif.outputs.ok == '1'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PROJET" --production-branch main
      - name: Publier
        if: steps.verif.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name "$PROJET" --branch "${{ github.ref_name }}" --commit-dirty=true
