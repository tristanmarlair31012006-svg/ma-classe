<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1000" height="360" fill="#fffaf0"/>
  <text x="500" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="#2b2b2b">L'échelle d'une carte</text>
  <!-- deux villes -->
  <circle cx="200" cy="130" r="14" fill="#c0392b" stroke="#2b2b2b" stroke-width="3"/>
  <text x="200" y="100" font-size="22" font-weight="700" text-anchor="middle">Ville A</text>
  <circle cx="680" cy="130" r="14" fill="#c0392b" stroke="#2b2b2b" stroke-width="3"/>
  <text x="680" y="100" font-size="22" font-weight="700" text-anchor="middle">Ville B</text>
  <line x1="214" y1="130" x2="666" y2="130" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="440" y="165" font-size="20" text-anchor="middle" fill="#2b2b2b">sur la carte : 6 cm</text>
  <!-- barre d'échelle : 1 cm = 80 px -->
  <g transform="translate(200,230)">
    <rect x="0" y="0" width="80" height="18" fill="#2b2b2b"/><rect x="80" y="0" width="80" height="18" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
    <rect x="160" y="0" width="80" height="18" fill="#2b2b2b"/><rect x="240" y="0" width="80" height="18" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
    <g font-size="18" font-weight="700" text-anchor="middle"><text x="0" y="45">0</text><text x="80" y="45">5</text><text x="160" y="45">10</text><text x="240" y="45">15</text><text x="320" y="45">20 km</text></g>
  </g>
  <text x="620" y="245" font-size="20" font-weight="700" fill="#2b2b2b">1 cm = 5 km</text>
  <text x="500" y="320" font-size="20" text-anchor="middle" fill="#2b2b2b">Calcul : 6 cm × 5 km = 30 km dans la réalité</text>
</svg>
