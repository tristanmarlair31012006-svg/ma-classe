<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1000" height="300" fill="#fffaf0"/>
  <!-- segments (longueurs non proportionnelles) -->
  <g font-weight="700" font-size="22" text-anchor="middle">
    <rect x="20" y="90" width="230" height="70" fill="#c9b79c" stroke="#2b2b2b" stroke-width="3"/>
    <text x="135" y="133">Préhistoire</text>
    <rect x="250" y="90" width="190" height="70" fill="#e8c27a" stroke="#2b2b2b" stroke-width="3"/>
    <text x="345" y="133">Antiquité</text>
    <rect x="440" y="90" width="190" height="70" fill="#9fc3a8" stroke="#2b2b2b" stroke-width="3"/>
    <text x="535" y="133">Moyen Âge</text>
    <rect x="630" y="90" width="160" height="70" fill="#a9c4e3" stroke="#2b2b2b" stroke-width="3"/>
    <text x="710" y="122" font-size="20">Temps</text><text x="710" y="146" font-size="20">modernes</text>
    <rect x="790" y="90" width="185" height="70" fill="#e3a9a9" stroke="#2b2b2b" stroke-width="3"/>
    <text x="882" y="122" font-size="20">Époque</text><text x="882" y="146" font-size="20">contemporaine</text>
  </g>
  <polygon points="975,80 995,125 975,170" fill="#2b2b2b"/>
  <g stroke="#2b2b2b" stroke-width="3"><line x1="250" y1="160" x2="250" y2="185"/><line x1="440" y1="160" x2="440" y2="185"/><line x1="630" y1="160" x2="630" y2="185"/><line x1="790" y1="160" x2="790" y2="185"/></g>
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#2b2b2b">
    <text x="250" y="210">− 3000</text><text x="440" y="210">476</text><text x="630" y="210">1492</text><text x="790" y="210">1789</text>
  </g>
  <g font-size="16" text-anchor="middle" fill="#5a5a5a">
    <text x="250" y="236">l'écriture</text><text x="440" y="236">fin de l'Empire</text><text x="440" y="256">romain d'Occident</text><text x="630" y="236">Colomb arrive</text><text x="630" y="256">en Amérique</text><text x="790" y="236">Révolution</text><text x="790" y="256">française</text>
  </g>
  <text x="882" y="70" font-size="18" text-anchor="middle" font-weight="700" fill="#2b2b2b">aujourd'hui →</text>
  <text x="500" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="#2b2b2b">Les périodes de l'histoire</text>
  <text x="500" y="290" font-size="14" text-anchor="middle" fill="#5a5a5a">Les cases ne sont pas à l'échelle : la Préhistoire est beaucoup plus longue que les autres périodes.</text>
</svg>
