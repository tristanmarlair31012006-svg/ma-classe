<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1000" height="520" fill="#f4f1e6"/>
  <!-- mer -->
  <path d="M860 0 H1000 V520 H900 C880 400 840 300 870 180 C885 110 860 50 860 0 Z" fill="#7fb3e0"/>
  <text x="940" y="270" font-size="22" font-weight="700" fill="#1d4f91" text-anchor="middle" transform="rotate(-90 940 270)">MER</text>
  <!-- bassin versant -->
  <path d="M60 60 C250 20 600 30 860 150 L880 330 C650 480 300 500 60 440 C20 300 20 160 60 60 Z" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="470" y="168" font-size="18" fill="#8a6d3b" font-weight="700">bassin du fleuve (ligne pointillée)</text>
  <!-- fleuve principal -->
  <path d="M110 260 C230 230 330 300 460 270 C590 240 700 290 880 250" fill="none" stroke="#2d6fb5" stroke-width="12" stroke-linecap="round"/>
  <!-- affluents -->
  <path d="M300 90 C320 160 380 220 420 278" fill="none" stroke="#2d6fb5" stroke-width="6" stroke-linecap="round"/>
  <path d="M600 440 C610 380 640 320 655 270" fill="none" stroke="#2d6fb5" stroke-width="6" stroke-linecap="round"/>
  <!-- étiquettes -->
  <g font-size="20" font-weight="700" fill="#2b2b2b">
    <circle cx="110" cy="260" r="10" fill="#fff" stroke="#2b2b2b" stroke-width="3"/>
    <text x="70" y="235">source</text>
    <circle cx="300" cy="90" r="8" fill="#fff" stroke="#2b2b2b" stroke-width="3"/>
    <text x="320" y="85">source de l'affluent</text>
    <text x="360" y="180" transform="rotate(50 360 180)">affluent</text>
    <circle cx="420" cy="278" r="10" fill="#f2c200" stroke="#2b2b2b" stroke-width="3"/>
    <text x="360" y="325">confluent</text>
    <text x="520" y="235">fleuve</text>
    <text x="610" y="470">affluent</text>
    <circle cx="655" cy="272" r="10" fill="#f2c200" stroke="#2b2b2b" stroke-width="3"/>
    <text x="680" y="320">confluent</text>
    <circle cx="872" cy="252" r="12" fill="#fff" stroke="#2b2b2b" stroke-width="3"/>
    <text x="690" y="215">embouchure →</text>
  </g>
  <text x="500" y="35" font-size="24" font-weight="700" text-anchor="middle" fill="#2b2b2b">Le chemin de l'eau, de la source à la mer</text>
  <g font-size="17" fill="#2d6fb5" font-weight="700"><text x="470" y="300">sens de l'eau →</text></g>
</svg>
