  busy=false;
  if(fail){pillT('Échec, nouvel essai…',true);tmr=setTimeout(save,2000);return}
  dirty=false;try{localStorage.removeItem('stageM1-draft')}catch(e){}setPill();

async function startDb(db){
  DB=db;let got=0;const tm=setTimeout(()=>{if(got<SECS.length)pillT('Données injoignables pour l\'instant',true)},10000);
  SECS.forEach(k=>{REFS[k]=db.doc('carnet/'+k);REFS[k].onSnapshot(snap=>{
    if(++got===SECS.length)clearTimeout(tm);
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(!snap.exists){const js=JSON.stringify(S[k]);if(js!==JSON.stringify(DEFS[k])||JSON.stringify(EMB[k]??null)!=='null'){REFS[k].set({v:JSON.parse(js)}).then(()=>{LAST[k]=js}).catch(()=>{})}else LAST[k]=js;return}
    const v=(snap.data()||{}).v;if(v==null)return;const js=JSON.stringify(v);LAST[k]=js;
    if((dirty||busy||Date.now()-lastEdit<5000)&&JSON.stringify(S[k])!==js)return;
    if(JSON.stringify(S[k])!==js){S[k]=JSON.parse(js);softRender()}
    if(got>=SECS.length&&!dirty)setPill();
  },()=>{clearTimeout(tm);pillT('Connexion aux données perdue',true)})});
  if(dirty)save();
}

// Leçons → Suivi : « Noter ce cours » arrive ici avec ?noter=1&lecon=…&titre=…&classe=…&date=…&capture=…
function noterCeCours(){
  const q=new URLSearchParams(location.search);if(!q.get('noter'))return;
  history.replaceState(null,'',location.pathname);
  const lecId=q.get('lecon')||'',titre=q.get('titre')||'Leçon',classe=q.get('classe')||'',date=q.get('date')||'',cap=q.get('capture');
  const jj=date?date.split('-').reverse().slice(0,2).join('/'):'';
  // même leçon, même classe : je complète la fiche existante
  let L=lecId?S.lecons.find(l=>l.lecId===lecId&&l.classe===classe):null;
  if(!L){L={id:'l'+Date.now(),titre,classe,seq:q.get('matiere')||'',date:jj,per:'',statut:'Donnée',files:[],liens:'',retour:'',bilan:'',comps:[],lecId};S.lecons.unshift(L)}
  else{L.date=jj||L.date;if(STAT.indexOf(L.statut)<2)L.statut='Donnée'}
  if(!S.classes.some(c=>c.nom===classe)&&classe)L.classe=classe;
  if(cap){L.files=L.files||[];L.files.push({id:cap,url:'/_fichier/'+cap,name:`Tableau ${jj||''} p.${q.get('page')||1}.jpg`.replace('  ',' '),size:0,kind:'Autre'})}
  tab='les';cur.lesOpen=L.id;cur.lesF='';mark();
  setTimeout(()=>{const d=document.querySelector(`details[data-les="${CSS.escape(L.id)}"]`);if(d){d.scrollIntoView({block:'start'});const t=d.querySelector('textarea[data-p$=".bilan"]');if(t)t.focus({preventScroll:true})}},300);
}

const memSauver=(m)=>{const o={...m};delete o.id;MesDonnees.doc('memoire/'+m.id).set(o).catch(()=>{})};

function memoireDoc(){
  // Pseudonymes stables : É1, É2… dans l'ordre d'apparition ; les prénoms sont aussi remplacés dans les textes
  const ps={};let n=0;[...MEM].reverse().forEach(m=>{const p=(m.prenom||'').trim();if(p&&!ps[p.toLowerCase()])ps[p.toLowerCase()]='É'+(++n)});
  const noms=Object.keys(ps).sort((a,b)=>b.length-a.length);
  const anon=t=>{let x=String(t||'');noms.forEach(p=>{x=x.replace(new RegExp('(^|[^\\p{L}])'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}])','giu'),(m0,a)=>a+ps[p])});return x};
  const rows=[...MEM].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(ps[(m.prenom||'').trim().toLowerCase()]||'–')}</td><td>${esc(anon(m.texte))}</td><td>${esc(anon(m.analyse))}</td></tr>`).join('');
  return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Observations DASPA – mémoire</title><style>body{font:14px/1.5 Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 20px;color:#222}h1{color:#7b4fa0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px;vertical-align:top}th{background:#f3ecfa;text-align:left}</style></head><body>
  <h1>Observations DASPA (anonymisées)</h1><p>${MEM.length} observation(s). Les prénoms sont remplacés par des codes (É1, É2…).</p>
  <table><tr><th>Date</th><th>Élève</th><th>Observation</th><th>Pour le mémoire</th></tr>${rows||'<tr><td colspan="4">Aucune observation.</td></tr>'}</table></body></html>`;
}

async function dl(name,data,btn){
  const type=name.endsWith('.json')?'application/json':'text/html';
  const f=new File([data],name,{type});
  try{
    // Sur iPad : la feuille de partage (Enregistrer dans Fichiers, OneDrive, Teams…)
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPad|iPhone|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document){await navigator.share({files:[f],title:name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  // Sur ordinateur : téléchargement classique
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
